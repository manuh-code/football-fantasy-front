# Un mismo dist/ sirve DOS sitios, según el host (ver src/config/site.ts):
#
#   fantasymx.cloud       → marketing: la landing es la RAÍZ y solo se conservan
#                           las páginas públicas de lectura. Todo lo demás se
#                           redirige (301) a game.fantasymx.cloud.
#   game.fantasymx.cloud  → la aplicación (la SPA completa).
#
# Este nginx recibe el tráfico DESPUÉS del proxy que termina TLS en el VPS, así
# que ese proxy debe conservar el Host original (`proxy_set_header Host $host;`
# en nginx, o el comportamiento por defecto de Caddy / Traefik / Nginx Proxy
# Manager). Si no lo hace, todo cae en el server por defecto (la app) y el router
# del cliente cubre lo esencial —muestra la landing en `/` y redirige las rutas
# de la app—, pero se pierden la landing prerenderizada y los 301.

# www → dominio principal. Es el host canónico del sitio de marketing.
server {
    listen 80;
    server_name www.fantasymx.cloud;

    return 301 https://fantasymx.cloud$request_uri;
}

# ── Marketing: https://fantasymx.cloud ─────────────────────────────────────────
server {
    listen 80;
    server_name fantasymx.cloud;

    root /usr/share/nginx/html;
    index index.html;

    # La raíz ES la landing. Se sirve el HTML prerenderizado con 200 y la URL se
    # queda en `/` (no es una redirección): dist/landingpage/index.html lo genera
    # scripts/prerender.mjs con la canónica puesta en `/`. Es HTML de entrada
    # (referencia assets con hash), así que se revalida siempre; el `try_files` no
    # pasa por `location ~* \.html$`, por eso la cabecera va aquí.
    location = / {
        try_files /landingpage/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # La URL vieja de la landing ya no existe: es la raíz.
    location ~ ^/landingpage/?$ {
        return 301 https://fantasymx.cloud/;
    }

    # Páginas públicas de lectura que se quedan aquí: son las URLs que ya están
    # publicadas en App Store / Google Play (privacidad, borrar cuenta) y en
    # Google (guías, acerca de). Mantener esta lista en sync con SHARED_ROUTES
    # de src/config/site.ts. Cada una: HTML prerenderizado → fallback SPA.
    location ~ ^/(?:about|guias|privacy|eliminar-cuenta|delete-account)(?:/|$) {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Cualquier archivo real (robots.txt, sitemap.xml, ads.txt, /img/…) se sirve
    # tal cual; lo que no es un archivo es una ruta de la app, y la app vive en
    # game.fantasymx.cloud. $request_uri conserva la query: los enlaces viejos
    # (invitaciones por correo, ?join=, el regreso de OAuth) siguen funcionando.
    location / {
        try_files $uri @app;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location @app {
        return 301 https://game.fantasymx.cloud$request_uri;
    }

    include snippets/static-assets.conf;
}

# ── App: https://game.fantasymx.cloud ──────────────────────────────────────────
# También es el server por defecto: localhost, la IP del VPS, los healthchecks y
# cualquier host que no sea de marketing se comportan como la app, igual que
# antes de la separación.
server {
    listen 80 default_server;
    server_name game.fantasymx.cloud localhost;

    root /usr/share/nginx/html;
    index index.html;

    # robots y sitemap propios del host: un sitemap solo puede listar URLs de su
    # mismo host. Los genera scripts/prerender.mjs (sitemap-app.xml) y
    # public/robots-app.txt.
    location = /robots.txt {
        alias /usr/share/nginx/html/robots-app.txt;
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        alias /usr/share/nginx/html/sitemap-app.xml;
        add_header Cache-Control "no-cache";
    }

    location / {
        # 1) archivo exacto; 2) HTML prerenderizado de la ruta (dist/<ruta>/index.html,
        #    servido con 200 directo — $uri/ provocaría un 301 a la barra final);
        # 3) fallback SPA.
        # Todo lo que resuelve aquí es HTML de entrada (referencia assets con
        # hash), así que debe revalidarse siempre; los estáticos con extensión
        # los atienden las locations regex de static-assets.conf con caché agresiva.
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    include snippets/static-assets.conf;
}
